version: '2'
linters:
  default: all
  disable:
    - exhaustruct
    - exhaustruct_v5
    - mnd
    - nlreturn
    - tagliatelle
    - varnamelen
    - goconst # meh
    - gomodguard # deprecated
    - wsl # deprecated
    - depguard
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
